<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>청산 카드 배틀 (하스 vanilla 짭)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--frame:#fbbf24;--bg:#1a1612;--cell:#3a2f25;--mana:#88c0d0;--hp:#bf616a}
html,body{height:100%}
body{background:radial-gradient(ellipse at center,#3a2f25 0%,#1a1612 60%,#0a0805 100%);color:#e2d5b8;font-family:'Noto Sans KR','Helvetica',sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{background:#0f0d09;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--frame);height:42px;flex-shrink:0}
header .title{color:var(--frame);font-weight:bold;font-size:14px;letter-spacing:1px}
header .menu{display:flex;gap:6px}
header button{background:#2d2620;color:#e2d5b8;border:1px solid #475569;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px}
header button:hover{background:#3a2f25;border-color:var(--frame)}

/* 보드 — 가운데 정렬 하스 풍 5단 */
#board{flex:1;display:grid;grid-template-rows:auto 1fr 1fr auto;gap:4px;padding:8px;min-height:0;position:relative}

/* 적 영웅 row */
.hero-row{display:flex;justify-content:center;align-items:center;gap:18px;min-height:120px}
.hero-portrait{position:relative;width:110px;height:130px;display:flex;flex-direction:column;align-items:center}
.hero-portrait img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #5a4030;box-shadow:0 0 18px rgba(0,0,0,0.6)}
.hero-portrait.foe img{border-color:#5a3030}
.hero-portrait.you img{border-color:#306030}
.hero-portrait.drop-target img{border-color:var(--frame);box-shadow:0 0 24px var(--frame);animation:pulse 0.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 36px var(--frame)}}
.hero-hp{position:absolute;bottom:0;background:#0f0d09;color:var(--hp);font-weight:bold;font-size:18px;padding:2px 10px;border-radius:14px;border:2px solid var(--hp)}

/* 영웅 능력 */
.hero-power{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#1d4ed8,#0a2080);border:3px solid #3b82f6;color:#fff;cursor:pointer;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px}
.hero-power:disabled{opacity:0.4;cursor:not-allowed;filter:grayscale(0.5)}
.hero-power .cost-pip{position:absolute;top:-4px;right:-4px;width:22px;height:22px;background:var(--mana);color:#0a1428;border:2px solid #0f0d09;border-radius:50%;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center}

/* 마나 / 덱 */
.mana-disp{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mana);font-weight:bold;font-size:12px}
.mana-disp .crystals{display:flex;flex-wrap:wrap;gap:2px;width:80px;justify-content:center}
.mana-disp .crystal{width:14px;height:14px;border-radius:50%;background:#1a1612;border:2px solid #88c0d0}
.mana-disp .crystal.full{background:radial-gradient(circle,#88c0d0,#3a5a6a);box-shadow:0 0 6px #88c0d0}
.deck-pile{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#a89878}
.deck-pile .deck-card{width:38px;height:54px;background:linear-gradient(135deg,#3a2f25,#1a1612);border:2px solid var(--frame);border-radius:5px;box-shadow:1px 1px 0 #0f0d09,2px 2px 0 #0f0d09}

/* 필드 — 가운데 */
.field{display:flex;justify-content:center;align-items:center;gap:6px;min-height:130px;padding:8px;background:rgba(0,0,0,0.35);border-radius:8px;flex-wrap:wrap;border:2px dashed transparent;transition:border-color 0.2s}
.field.drop-target{border-color:var(--frame);background:rgba(251,191,36,0.08)}

/* 미니언 카드 */
.minion{width:90px;height:128px;background:linear-gradient(180deg,#3a2f25,#1a1612);border:3px solid #5a4030;border-radius:8px;padding:4px;display:flex;flex-direction:column;cursor:pointer;position:relative;transition:transform 0.15s, box-shadow 0.15s;flex-shrink:0}
.minion:hover{transform:translateY(-6px);border-color:var(--frame);box-shadow:0 8px 20px rgba(0,0,0,0.6)}
.minion.can-attack{border-color:#7ea564;box-shadow:0 0 10px #7ea564}
.minion.exhausted{opacity:0.55}
.minion.taunt{box-shadow:inset 0 0 0 3px #d4a857, 0 0 8px #d4a857}
.minion.shield{outline:2px solid #ffffff;outline-offset:1px;box-shadow:0 0 12px rgba(255,255,255,0.6)}
.minion.taunt.shield{box-shadow:inset 0 0 0 3px #d4a857, 0 0 12px rgba(255,255,255,0.7)}
.minion .img-frame{height:48px;overflow:hidden;border-radius:4px;background:#0f0d09;margin-bottom:2px}
.minion .img-frame img{width:100%;height:auto;display:block;margin-top:-8px;object-fit:cover}
.minion .name{font-size:9px;font-weight:bold;color:var(--frame);text-align:center;line-height:1.1;padding:1px 0}
.minion .stats{display:flex;justify-content:space-between;font-weight:bold;padding:2px 4px 0;font-size:13px}
.minion .atk{color:#d4a857;text-shadow:1px 1px 0 #000}
.minion .hp-num{color:var(--hp);text-shadow:1px 1px 0 #000}
.minion.drop-target{outline:3px solid var(--frame);outline-offset:2px}

/* 손 — 부채꼴 효과 */
#you-hand-area{min-height:155px;display:flex;justify-content:center;align-items:flex-end;padding:6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.4));flex-shrink:0;perspective:600px}
#you-hand{display:flex;gap:0;justify-content:center;align-items:flex-end}
.hand-card{width:96px;height:140px;background:linear-gradient(180deg,#2d2620,#1a1612);border:3px solid #5a4030;border-radius:8px;padding:4px;cursor:grab;display:flex;flex-direction:column;position:relative;transition:transform 0.2s, margin 0.2s;flex-shrink:0;margin:0 -8px}
.hand-card:hover{transform:translateY(-30px) scale(1.4);margin:0 20px;z-index:30;border-color:var(--frame);box-shadow:0 10px 30px rgba(0,0,0,0.7)}
.hand-card.dragging{opacity:0.4;cursor:grabbing}
.hand-card.playable{border-color:#7ea564}
.hand-card.unplayable{opacity:0.55;cursor:not-allowed}
.hand-card .cost-pip{position:absolute;top:-6px;left:-6px;width:26px;height:26px;background:var(--mana);color:#0a1428;border:2px solid #0f0d09;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;box-shadow:0 0 4px rgba(0,0,0,0.5)}
.hand-card .img-frame{height:54px;overflow:hidden;border-radius:4px;background:#0f0d09;margin-bottom:2px}
.hand-card .img-frame img{width:100%;display:block;margin-top:-6px}
.hand-card .spell-icon{height:54px;display:flex;align-items:center;justify-content:center;font-size:32px;background:radial-gradient(circle,#1d4ed8,#0a2080);border-radius:4px;margin-bottom:2px}
.hand-card .name{font-size:9px;font-weight:bold;color:var(--frame);text-align:center;line-height:1.15;padding:1px 0;min-height:22px}
.hand-card .body{font-size:8px;color:#cbd5e1;line-height:1.2;padding:2px;flex:1;text-align:center;display:flex;align-items:center;justify-content:center}
.hand-card .stats{display:flex;justify-content:space-between;font-weight:bold;padding:0 2px;font-size:12px}

/* 적 손 — 카드 뒷면 부채꼴 */
#foe-hand-area{min-height:60px;display:flex;justify-content:center;padding:4px 6px;flex-shrink:0}
#foe-hand{display:flex;gap:0;justify-content:center}
.foe-card-back{width:38px;height:52px;background:linear-gradient(135deg,#3a2520,#5a2030);border:2px solid #bf616a;border-radius:4px;margin:0 -4px;transform:rotate(180deg);box-shadow:1px 1px 0 #0f0d09}

/* 컨트롤 */
#turn-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,#1d4ed8,#0a2080);color:#fff;border:3px solid var(--frame);padding:14px 18px;border-radius:50%;cursor:pointer;font-weight:bold;font-size:13px;width:90px;height:90px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;z-index:5;box-shadow:0 0 18px rgba(251,191,36,0.4)}
#turn-btn:hover{box-shadow:0 0 26px rgba(251,191,36,0.7)}
#turn-btn.foe-turn{background:linear-gradient(180deg,#5a3030,#2a1010);border-color:#5a3030;cursor:not-allowed;color:#a89878;box-shadow:none}

/* 로그 */
#log{position:fixed;top:50px;right:8px;width:240px;max-height:38vh;overflow-y:auto;background:rgba(15,13,9,0.92);border:1px solid #3a2f25;border-radius:6px;padding:6px 8px;font-size:10px;line-height:1.5;z-index:15;display:none}
#log.show{display:block}
#log .e{color:#a89878;padding:2px 0;border-bottom:1px solid #1f1a14}
#log .e.you{color:#88c0d0}
#log .e.foe{color:#bf616a}
#log .e.sys{color:var(--frame)}

/* 드래그 미리보기 */
#drag-preview{position:fixed;pointer-events:none;z-index:100;display:none;transform:translate(-50%,-50%)}

/* 오버레이 */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:200;font-size:36px;color:var(--frame);flex-direction:column;gap:20px}
#overlay.show{display:flex}
#overlay button{background:#1d4ed8;color:#fff;border:0;padding:14px 28px;border-radius:6px;cursor:pointer;font-size:16px}

/* 대상 선택 모드 — 화살표 */
.targeting #arrow{display:block}
#arrow{display:none;position:fixed;pointer-events:none;z-index:90;font-size:48px;color:var(--frame);text-shadow:0 0 10px var(--frame)}

@media (max-width:768px){
  .hero-portrait{width:88px;height:104px}
  .hero-portrait img{width:78px;height:78px;border-width:3px}
  .hero-power{width:60px;height:60px;font-size:9px}
  .minion{width:74px;height:106px}
  .hand-card{width:78px;height:118px;margin:0 -12px}
  .hand-card:hover{transform:translateY(-20px) scale(1.2);margin:0 12px}
  #turn-btn{width:70px;height:70px;font-size:11px}
  .field{min-height:108px}
}
</style>
</head>
<body>
<header>
  <div class="title">⚔️ 청산 카드 배틀</div>
  <div class="menu">
    <button id="btn-new">새 게임</button>
    <button id="btn-help">도움말</button>
    <button id="btn-log">로그</button>
  </div>
</header>

<div id="board">
  <!-- 적 손 (뒷면) -->
  <div id="foe-hand-area"><div id="foe-hand"></div></div>

  <!-- 적 영웅 + 필드 -->
  <div class="hero-row" id="foe-row">
    <div class="mana-disp"><div class="crystals" id="foe-mana-cryst"></div><span><span id="foe-mana">0</span>/<span id="foe-max-mana">0</span></span></div>
    <div class="hero-portrait foe" id="foe-hero">
      <img src="cards/08_blackmark.png" alt="foe">
      <div class="hero-hp">❤️ <span id="foe-hp">30</span></div>
    </div>
    <div class="deck-pile"><div class="deck-card"></div><small>덱 <span id="foe-deck">20</span></small></div>
  </div>
  <div class="field" id="foe-field"></div>

  <!-- 내 필드 + 영웅 -->
  <div class="field" id="you-field"></div>
  <div class="hero-row" id="you-row">
    <div class="deck-pile"><div class="deck-card"></div><small>덱 <span id="you-deck">20</span></small></div>
    <button class="hero-power" id="you-power">
      <span class="cost-pip" id="power-cost">2</span>
      도술의<br>화살<br><small>1피해</small>
    </button>
    <div class="hero-portrait you" id="you-hero">
      <img src="cards/01_hanyujin.png" alt="you">
      <div class="hero-hp">❤️ <span id="you-hp">30</span></div>
    </div>
    <div class="mana-disp"><div class="crystals" id="you-mana-cryst"></div><span><span id="you-mana">0</span>/<span id="you-max-mana">0</span></span></div>
  </div>
</div>

<!-- 내 손 -->
<div id="you-hand-area"><div id="you-hand"></div></div>

<button id="turn-btn">턴<br>종료</button>

<div id="log"></div>
<div id="arrow">⚔️</div>
<div id="drag-preview"></div>

<div id="overlay">
  <div id="overlay-msg"></div>
  <button id="overlay-btn">새 게임</button>
</div>

<script>
// ─── 카드 풀 (30장 v4: 영웅 10 + 일반 미니언 15 + 주문 5) ───
const CARDS = [
  // 영웅 (10) — type='minion'로 통일, hero 표시는 effect_key로
  {id:'01_hanyujin',  name:'한유진',     type:'minion', cost:8, atk:7, hp:7, attr:'물리', effect_key:'charge',                 text:'돌진'},
  {id:'02_lunaria',   name:'루나리아',   type:'minion', cost:5, atk:4, hp:5, attr:'바람', effect_key:'windfury',               text:'질풍'},
  {id:'03_gardrin',   name:'가르드린',   type:'minion', cost:6, atk:4, hp:8, attr:'물리', effect_key:'taunt_divine_shield',    text:'도발, 신성한 방패'},
  {id:'04_lion',      name:'라이언',     type:'minion', cost:4, atk:4, hp:4, attr:'물리', effect_key:'charge',                 text:'돌진'},
  {id:'05_raven',     name:'레이븐',     type:'minion', cost:5, atk:3, hp:5, attr:'냉기', effect_key:'battlecry_dmg_target_3', text:'전투의 함성: 대상 3피해'},
  {id:'06_kacy',      name:'케이시',     type:'minion', cost:7, atk:7, hp:6, attr:'화염', effect_key:'charge',                 text:'돌진'},
  {id:'07_nilas',     name:'닐라스',     type:'minion', cost:9, atk:6, hp:8, attr:'자연', effect_key:'battlecry_ally_buff_1_1',text:'전투의 함성: 내 미니언 모두 +1/+1'},
  {id:'08_blackmark', name:'블랙마크',   type:'minion', cost:6, atk:5, hp:5, attr:'암흑', effect_key:'battlecry_dmg_hero_3',   text:'전투의 함성: 적 영웅에 3피해'},
  {id:'09_old_raven', name:'올드 레이븐',type:'minion', cost:10,atk:9, hp:9, attr:'화염', effect_key:'battlecry_draw_2',       text:'전투의 함성: 카드 2장 드로우'},
  {id:'10_anari',     name:'아나리',     type:'minion', cost:3, atk:3, hp:3, attr:'물리', effect_key:'battlecry_draw_1',       text:'전투의 함성: 카드 1장 드로우'},
  // 일반 미니언 (15)
  {id:'e01_orc_warrior',   name:'오크 전사',     type:'minion', cost:2, atk:3, hp:2, attr:'물리', effect_key:'vanilla',                   text:''},
  {id:'e02_goblin_worker', name:'고블린 일꾼',   type:'minion', cost:1, atk:1, hp:1, attr:'물리', effect_key:'vanilla',                   text:''},
  {id:'e03_wolf',          name:'늑대',          type:'minion', cost:2, atk:2, hp:2, attr:'자연', effect_key:'vanilla',                   text:''},
  {id:'e04_gate_guardian', name:'성문 수호자',   type:'minion', cost:4, atk:2, hp:7, attr:'물리', effect_key:'taunt',                     text:'도발'},
  {id:'e05_elf_archer',    name:'엘프 궁수',     type:'minion', cost:3, atk:3, hp:2, attr:'바람', effect_key:'battlecry_dmg_minion_2',    text:'전투의 함성: 적 미니언 1체 2피해'},
  {id:'e06_priest',        name:'사제',          type:'minion', cost:3, atk:1, hp:4, attr:'물리', effect_key:'battlecry_heal_hero_2',     text:'전투의 함성: 영웅 +2 생명'},
  {id:'e07_imp',           name:'임프',          type:'minion', cost:1, atk:2, hp:1, attr:'암흑', effect_key:'vanilla',                   text:''},
  {id:'e08_dwarf_miner',   name:'드워프 광부',   type:'minion', cost:2, atk:2, hp:3, attr:'물리', effect_key:'vanilla',                   text:''},
  {id:'e09_mage_apprentice',name:'마법사 견습',  type:'minion', cost:2, atk:1, hp:3, attr:'냉기', effect_key:'battlecry_dmg_target_1',    text:'전투의 함성: 대상 1피해'},
  {id:'e10_berserker',     name:'광전사',        type:'minion', cost:4, atk:5, hp:3, attr:'화염', effect_key:'vanilla',                   text:''},
  {id:'e11_hunter',        name:'사냥꾼',        type:'minion', cost:3, atk:3, hp:3, attr:'바람', effect_key:'vanilla',                   text:''},
  {id:'e12_rogue',         name:'도적',          type:'minion', cost:2, atk:3, hp:1, attr:'암흑', effect_key:'vanilla',                   text:''},
  {id:'e13_giant_spider',  name:'거대 거미',     type:'minion', cost:1, atk:1, hp:2, attr:'자연', effect_key:'vanilla',                   text:''},
  {id:'e14_fire_elemental',name:'화염 정령',     type:'minion', cost:3, atk:4, hp:2, attr:'화염', effect_key:'vanilla',                   text:''},
  {id:'e15_ice_elemental', name:'얼음 정령',     type:'minion', cost:4, atk:3, hp:4, attr:'냉기', effect_key:'vanilla',                   text:''},
  // 주문 (5)
  {id:'s01_magic_arrow',   name:'마법의 화살',   type:'spell',  cost:1, attr:'화염', effect_key:'spell_dmg_target_1',  text:'주문: 대상 1피해'},
  {id:'s02_fireball',      name:'화염구',        type:'spell',  cost:4, attr:'화염', effect_key:'spell_dmg_target_6',  text:'주문: 대상 6피해'},
  {id:'s03_heal',          name:'치유의 빛',     type:'spell',  cost:2, attr:'자연', effect_key:'spell_heal_hero_6',   text:'주문: 영웅 6 회복'},
  {id:'s04_frost_bolt',    name:'얼음 화살',     type:'spell',  cost:2, attr:'냉기', effect_key:'spell_dmg_target_2',  text:'주문: 대상 2피해'},
  {id:'s05_shadow_strike', name:'그림자 일격',   type:'spell',  cost:3, attr:'암흑', effect_key:'spell_dmg_target_4',  text:'주문: 대상 4피해'},
];

function imgOf(card) { return `cards/${card.id}.png`; }

// 주문이 대상 지정 필요한지
function needsTarget(c) {
  if (c.type !== 'spell') return false;
  return c.effect_key.startsWith('spell_dmg_target');
}

// ─── 상태 ─────────────────────────────────────
let state = null;
let targeting = null;
let drag = null;

function newDeck() {
  const d = [];
  while (d.length < 20) {
    const c = CARDS[Math.floor(Math.random()*CARDS.length)];
    d.push({...c, _uid: Math.random().toString(36).slice(2,8)});
  }
  return d;
}

function initGame() {
  state = {
    you: {hp:30, maxHp:30, mana:0, maxMana:0, deck:newDeck(), hand:[], field:[], powerUsed:false},
    foe: {hp:30, maxHp:30, mana:0, maxMana:0, deck:newDeck(), hand:[], field:[], powerUsed:false},
    turn: 'you',
    over: false,
  };
  for (let i=0;i<3;i++) { state.you.hand.push(state.you.deck.pop()); state.foe.hand.push(state.foe.deck.pop()); }
  startTurn('you');
  log('새 게임 시작', 'sys');
  render();
}

function startTurn(side) {
  const p = state[side];
  p.maxMana = Math.min(10, p.maxMana + 1);
  p.mana = p.maxMana;
  p.powerUsed = false;
  if (p.deck.length > 0) p.hand.push(p.deck.pop());
  p.field.forEach(m => { m.exhausted = false; m._attacksLeft = 0; });
  state.turn = side;
  log(side==='you'?'── 내 턴 ──':'── 적 턴 ──', 'sys');
}

function endTurn() {
  if (state.over) return;
  if (state.turn === 'you') {
    startTurn('foe');
    render();
    setTimeout(foeAI, 700);
  } else {
    startTurn('you');
    render();
  }
}

function foeAI() {
  if (state.over) return;
  const p = state.foe;
  let safety = 0;
  while (safety++ < 10) {
    const playable = p.hand.filter(c => c.cost <= p.mana);
    if (!playable.length) break;
    playable.sort((a,b)=>b.cost-a.cost);
    const c = playable[0];
    if (c.type === 'minion') {
      // 전투의 함성 대상 자동 선택
      let tgt = null;
      if (battlecryNeedsTarget(c.effect_key)) {
        if (state.you.field.length) tgt = {side:'you', target:'minion', idx:0};
        else tgt = {side:'you', target:'hero'};
      }
      playMinion('foe', c, tgt);
    } else if (c.type === 'spell') {
      const k = c.effect_key;
      if (k.startsWith('spell_heal_hero')) castSpell('foe', c, null);
      else if (k.startsWith('spell_dmg_target')) {
        const tgt = state.you.field[0]
          ? {side:'you', target:'minion', idx:0}
          : {side:'you', target:'hero'};
        castSpell('foe', c, tgt);
      } else castSpell('foe', c, null);
    }
  }
  for (const m of [...p.field]) {
    if (m.exhausted) continue;
    const maxAtk = hasWindfury(m) ? 2 : 1;
    while ((m._attacksLeft||0) < maxAtk && !m.exhausted) {
      const taunts = state.you.field.filter(hasTaunt);
      let target;
      if (taunts.length) target = taunts[0];
      else target = Math.random() < 0.4 ? state.you.field[0] : null;
      if (target) attackMinion('foe', m, target);
      else { attackHero('foe', m); break; }
      if (state.over) return;
    }
  }
  if (p.mana >= 2 && !p.powerUsed) {
    p.mana -= 2; p.powerUsed = true;
    state.you.hp -= 1;
    log('적 영웅능력 → 내 영웅 1피해', 'foe');
    checkOver();
  }
  setTimeout(() => { if (!state.over) { startTurn('you'); render(); } }, 800);
}

// ─── 효과 키워드 헬퍼 ─────────────────────────
function hasCharge(c)   { return c.effect_key === 'charge'; }
function hasTaunt(c)    { return c.effect_key === 'taunt' || c.effect_key === 'taunt_divine_shield'; }
function hasShield(c)   { return c._divineShield === true; }
function hasWindfury(c) { return c.effect_key === 'windfury'; }

function applyDamageToMinion(m, dmg) {
  if (m._divineShield) { m._divineShield = false; log(`${m.name} 신성한 방패 소진`, 'sys'); return; }
  m.hp -= dmg;
}

// ─── 전투의 함성 실행 ─────────────────────────
function executeBattlecry(side, card, target) {
  const p = state[side];
  const opp = side === 'you' ? state.foe : state.you;
  const k = card.effect_key;
  const m = k.match(/^battlecry_dmg_target_(\d+)$/);
  if (m && target) {
    const d = +m[1];
    if (target.target === 'hero') state[target.side].hp -= d;
    else if (target.target === 'minion') {
      const tm = state[target.side].field[target.idx];
      if (tm) applyDamageToMinion(tm, d);
    }
    return;
  }
  const mm = k.match(/^battlecry_dmg_minion_(\d+)$/);
  if (mm && target && target.target === 'minion') {
    const tm = state[target.side].field[target.idx];
    if (tm) applyDamageToMinion(tm, +mm[1]);
    return;
  }
  const mh = k.match(/^battlecry_dmg_hero_(\d+)$/);
  if (mh) { opp.hp -= +mh[1]; return; }
  const ma = k.match(/^battlecry_aoe_(\d+)$/);
  if (ma) { opp.field.forEach(x => applyDamageToMinion(x, +ma[1])); return; }
  const mhe = k.match(/^battlecry_heal_hero_(\d+)$/);
  if (mhe) { p.hp = Math.min(p.maxHp, p.hp + +mhe[1]); return; }
  const md = k.match(/^battlecry_draw_(\d+)$/);
  if (md) { for (let i=0;i<+md[1];i++) if (p.deck.length) p.hand.push(p.deck.pop()); return; }
  const mb = k.match(/^battlecry_ally_buff_(\d+)_(\d+)$/);
  if (mb) {
    const [x, y] = [+mb[1], +mb[2]];
    p.field.forEach(f => { if (f !== card) { f.atk += x; f.hp += y; } });
    return;
  }
}

// 전투의 함성이 대상 지정이 필요한가
function battlecryNeedsTarget(k) {
  return /^battlecry_dmg_(target|minion)_/.test(k);
}

function playMinion(side, card, target) {
  const p = state[side];
  const idx = p.hand.indexOf(card);
  if (idx < 0) return;
  if (card.cost > p.mana) return;
  p.mana -= card.cost;
  p.hand.splice(idx, 1);
  card.exhausted = !hasCharge(card);
  card._attacksLeft = 0;
  if (hasWindfury(card)) card._windfury = true;
  if (card.effect_key === 'taunt_divine_shield') card._divineShield = true;
  p.field.push(card);
  log(`${side==='you'?'내':'적'} ${card.name} 소환 (${card.atk}/${card.hp})`, side);
  if (card.effect_key && card.effect_key.startsWith('battlecry_')) {
    executeBattlecry(side, card, target);
  }
  cleanupField();
  checkOver();
}

function castSpell(side, card, target) {
  const p = state[side];
  const opp = side === 'you' ? state.foe : state.you;
  const idx = p.hand.indexOf(card);
  if (idx >= 0) { p.hand.splice(idx, 1); p.mana -= card.cost; }
  log(`${side==='you'?'내':'적'} ${card.name} 시전`, side);
  const k = card.effect_key;
  const m = k.match(/^spell_dmg_target_(\d+)$/);
  if (m && target) {
    const d = +m[1];
    if (target.target === 'hero') state[target.side].hp -= d;
    else if (target.target === 'minion') {
      const tm = state[target.side].field[target.idx];
      if (tm) applyDamageToMinion(tm, d);
    }
  }
  const mh = k.match(/^spell_heal_hero_(\d+)$/);
  if (mh) { p.hp = Math.min(p.maxHp, p.hp + +mh[1]); }
  cleanupField();
  checkOver();
}

function attackMinion(side, attacker, target) {
  // 신성한 방패 우선
  const attackerDmg = target.atk;
  const targetDmg = attacker.atk;
  applyDamageToMinion(target, targetDmg);
  applyDamageToMinion(attacker, attackerDmg);
  // 질풍: attacksLeft 관리
  attacker._attacksLeft = (attacker._attacksLeft||0) + 1;
  const maxAtk = hasWindfury(attacker) ? 2 : 1;
  if (attacker._attacksLeft >= maxAtk) attacker.exhausted = true;
  log(`${side==='you'?'내':'적'} ${attacker.name} → ${target.name}`, side);
  cleanupField();
}

function attackHero(side, attacker) {
  const target = side === 'you' ? state.foe : state.you;
  target.hp -= attacker.atk;
  attacker._attacksLeft = (attacker._attacksLeft||0) + 1;
  const maxAtk = hasWindfury(attacker) ? 2 : 1;
  if (attacker._attacksLeft >= maxAtk) attacker.exhausted = true;
  log(`${side==='you'?'내':'적'} ${attacker.name} → ${side==='you'?'적':'내'} 영웅 ${attacker.atk}피해`, side);
  checkOver();
}

function cleanupField() {
  state.you.field = state.you.field.filter(m => m.hp > 0);
  state.foe.field = state.foe.field.filter(m => m.hp > 0);
}

function checkOver() {
  if (state.you.hp <= 0) { state.over=true; gameOver('패배'); }
  else if (state.foe.hp <= 0) { state.over=true; gameOver('승리'); }
}

function gameOver(result) {
  document.getElementById('overlay-msg').textContent = result==='승리'?'🎉 승리!':'💀 패배';
  document.getElementById('overlay').classList.add('show');
  log('=== ' + result + ' ===', 'sys');
}

// ─── 드래그 앤 드롭 ───────────────────────────
function startDrag(card, idx, e) {
  if (state.turn !== 'you' || state.over) return;
  if (card.cost > state.you.mana) return;
  drag = {card, idx};
  // 드래그 미리보기 — 큰 카드
  const prev = document.getElementById('drag-preview');
  prev.innerHTML = renderHandCardHTML(card, true);
  prev.style.display = 'block';
  prev.firstElementChild.style.transform = 'scale(1.2)';
  movePreview(e);
  document.body.classList.add('targeting');
}
function movePreview(e) {
  const prev = document.getElementById('drag-preview');
  prev.style.left = e.clientX + 'px';
  prev.style.top = e.clientY + 'px';
}
function endDrag() {
  drag = null;
  document.getElementById('drag-preview').style.display = 'none';
  document.body.classList.remove('targeting');
  document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
}

function onDrop(side, kind, idx) {
  if (!drag) return;
  const c = drag.card;
  if (c.cost > state.you.mana) { endDrag(); return; }
  if (c.type === 'minion') {
    if (side === 'you' && kind === 'field') {
      // 전투의 함성 대상 필요한 경우 — 일단 자동 선택 (적 필드 첫번째 or 적 영웅)
      let tgt = null;
      if (battlecryNeedsTarget(c.effect_key)) {
        if (state.foe.field.length) tgt = {side:'foe', target:'minion', idx:0};
        else tgt = {side:'foe', target:'hero'};
      }
      playMinion('you', c, tgt);
    }
  } else if (c.type === 'spell') {
    const k = c.effect_key;
    if (k.startsWith('spell_dmg_target')) {
      if (kind === 'hero') castSpell('you', c, {side, target:'hero'});
      else if (kind === 'minion') castSpell('you', c, {side, target:'minion', idx});
    } else if (k.startsWith('spell_heal_hero')) {
      castSpell('you', c, null);
    }
  }
  endDrag();
  render();
}

// 미니언 공격도 드래그
function startMinionDrag(m, idx, e) {
  if (state.turn !== 'you' || state.over) return;
  if (m.exhausted) return;
  drag = {minion:m, attackMode:true};
  document.body.classList.add('targeting');
  movePreview(e);
}

function onAttackDrop(side, kind, idx) {
  if (!drag || !drag.attackMode) return;
  const m = drag.minion;
  if (side === 'foe' && kind === 'minion') {
    const taunts = state.foe.field.filter(hasTaunt);
    const tgt = state.foe.field[idx];
    if (taunts.length && !taunts.includes(tgt)) { log('도발 미니언 먼저', 'sys'); endDrag(); return; }
    attackMinion('you', m, tgt);
  } else if (side === 'foe' && kind === 'hero') {
    const taunts = state.foe.field.filter(hasTaunt);
    if (taunts.length) { log('도발 먼저', 'sys'); endDrag(); return; }
    attackHero('you', m);
  }
  endDrag();
  render();
}

// 영웅 능력 (간단 — 적 영웅에 1피해)
document.getElementById('you-power').addEventListener('click', () => {
  if (state.turn !== 'you' || state.over) return;
  const p = state.you;
  if (p.mana < 2 || p.powerUsed) return;
  p.mana -= 2; p.powerUsed = true;
  state.foe.hp -= 1;
  log('영웅 능력 → 적 영웅 1피해', 'you');
  cleanupField();
  checkOver();
  render();
});

// ─── 렌더 ───────────────────────────────────
function manaCrystalsHTML(cur, max) {
  let h = '';
  for (let i=0;i<max;i++) h += `<div class="crystal${i<cur?' full':''}"></div>`;
  return h;
}

function renderMinionHTML(m, side, idx) {
  const img = imgOf(m);
  const tauntCls  = hasTaunt(m)   ? ' taunt' : '';
  const shieldCls = m._divineShield ? ' shield' : '';
  return `<div class="minion ${side==='you'?(m.exhausted?'exhausted':'can-attack'):''}${tauntCls}${shieldCls}" data-side="${side}" data-idx="${idx}">
    ${img?`<div class="img-frame"><img src="${img}"></div>`:''}
    <div class="name">${m.name}</div>
    <div class="stats"><span class="atk">⚔️${m.atk}</span><span class="hp-num">❤️${m.hp}</span></div>
  </div>`;
}

function renderHandCardHTML(c, preview=false) {
  const img = imgOf(c);
  return `<div class="hand-card ${c.cost <= state.you.mana && state.turn === 'you' ? 'playable' : 'unplayable'}">
    <div class="cost-pip">${c.cost}</div>
    ${c.type==='minion' ? `<div class="img-frame"><img src="${img}"></div>` : `<div class="spell-icon"><img src="${img}" style="width:100%;height:100%;object-fit:cover;border-radius:4px"></div>`}
    <div class="name">${c.name}</div>
    <div class="body">${c.text||''}</div>
    ${c.type==='minion' ? `<div class="stats"><span class="atk">⚔️${c.atk}</span><span class="hp-num">❤️${c.hp}</span></div>` : `<div class="stats" style="justify-content:center;color:#88c0d0">주문</div>`}
  </div>`;
}

function render() {
  document.getElementById('you-hp').textContent = state.you.hp;
  document.getElementById('foe-hp').textContent = state.foe.hp;
  document.getElementById('you-mana').textContent = state.you.mana;
  document.getElementById('you-max-mana').textContent = state.you.maxMana;
  document.getElementById('foe-mana').textContent = state.foe.mana;
  document.getElementById('foe-max-mana').textContent = state.foe.maxMana;
  document.getElementById('you-deck').textContent = state.you.deck.length;
  document.getElementById('foe-deck').textContent = state.foe.deck.length;
  document.getElementById('you-mana-cryst').innerHTML = manaCrystalsHTML(state.you.mana, state.you.maxMana);
  document.getElementById('foe-mana-cryst').innerHTML = manaCrystalsHTML(state.foe.mana, state.foe.maxMana);
  document.getElementById('turn-btn').classList.toggle('foe-turn', state.turn === 'foe');
  document.getElementById('turn-btn').innerHTML = state.turn === 'you' ? '턴<br>종료' : '적<br>턴...';
  document.getElementById('you-power').disabled = state.you.mana < 2 || state.you.powerUsed || state.turn !== 'you';

  // 필드
  for (const side of ['you','foe']) {
    const f = document.getElementById(side+'-field');
    f.innerHTML = state[side].field.map((m,i) => renderMinionHTML(m, side, i)).join('');
    // 클릭/드래그 바인딩
    f.querySelectorAll('.minion').forEach(el => {
      const i = +el.dataset.idx;
      const s = el.dataset.side;
      el.addEventListener('mousedown', e => {
        if (s === 'you') startMinionDrag(state.you.field[i], i, e);
      });
      el.addEventListener('mouseup', e => {
        if (drag && drag.attackMode && s === 'foe') onAttackDrop('foe','minion',i);
        else if (drag && drag.card && s === 'foe' && drag.card.effect_key && drag.card.effect_key.startsWith('spell_dmg_target')) onDrop('foe','minion',i);
      });
      el.addEventListener('mouseenter', () => {
        if (drag && drag.attackMode && s === 'foe') el.classList.add('drop-target');
        if (drag && drag.card && s === 'foe' && drag.card.effect_key && drag.card.effect_key.startsWith('spell_dmg_target')) el.classList.add('drop-target');
      });
      el.addEventListener('mouseleave', () => el.classList.remove('drop-target'));
    });
  }
  // 손
  const hand = document.getElementById('you-hand');
  hand.innerHTML = state.you.hand.map(c => renderHandCardHTML(c)).join('');
  hand.querySelectorAll('.hand-card').forEach((el, i) => {
    el.addEventListener('mousedown', e => {
      const c = state.you.hand[i];
      startDrag(c, i, e);
    });
  });
  // 적 손
  const fh = document.getElementById('foe-hand');
  fh.innerHTML = state.foe.hand.map(() => '<div class="foe-card-back"></div>').join('');
}

// 글로벌 마우스
document.addEventListener('mousemove', e => { if (drag) movePreview(e); });
document.addEventListener('mouseup', e => {
  if (!drag) return;
  // hero / field에 드롭 안 됐으면 취소
  const elements = document.elementsFromPoint(e.clientX, e.clientY);
  let handled = false;
  for (const el of elements) {
    if (el.id === 'foe-hero' || el.closest('#foe-hero')) {
      if (drag.attackMode) onAttackDrop('foe','hero');
      else if (drag.card && drag.card.effect_key && drag.card.effect_key.startsWith('spell_dmg_target')) onDrop('foe','hero');
      handled = true; break;
    }
    if (el.id === 'you-hero' || el.closest('#you-hero')) {
      if (drag.card && drag.card.effect_key && drag.card.effect_key.startsWith('spell_heal_hero')) onDrop('you','hero');
      handled = true; break;
    }
    if (el.id === 'you-field' || el.closest('#you-field')) {
      if (drag.card && drag.card.type === 'minion') onDrop('you','field');
      handled = true; break;
    }
    if (el.classList && el.classList.contains('minion')) break;  // 미니언 자체 핸들러
  }
  if (!handled) endDrag();
});

// hero 드롭 영역 mouseenter (시각 표시)
document.getElementById('foe-hero').addEventListener('mouseenter', () => {
  if (drag && (drag.attackMode || (drag.card && drag.card.effect_key && drag.card.effect_key.startsWith('spell_dmg_target'))))
    document.getElementById('foe-hero').classList.add('drop-target');
});
document.getElementById('foe-hero').addEventListener('mouseleave', () => document.getElementById('foe-hero').classList.remove('drop-target'));
document.getElementById('you-field').addEventListener('mouseenter', () => {
  if (drag && drag.card && drag.card.type === 'minion') document.getElementById('you-field').classList.add('drop-target');
});
document.getElementById('you-field').addEventListener('mouseleave', () => document.getElementById('you-field').classList.remove('drop-target'));

// ─── 로그 ────────────────────────────────────
function log(msg, kind) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = 'e' + (kind?' '+kind:'');
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

// ─── 컨트롤 ──────────────────────────────────
document.getElementById('turn-btn').addEventListener('click', () => { if (state.turn==='you' && !state.over) endTurn(); });
document.getElementById('btn-new').addEventListener('click', () => initGame());
document.getElementById('overlay-btn').addEventListener('click', () => { document.getElementById('overlay').classList.remove('show'); initGame(); });
document.getElementById('btn-log').addEventListener('click', () => document.getElementById('log').classList.toggle('show'));
document.getElementById('btn-help').addEventListener('click', () => alert('🎯 하스스톤 vanilla 풍\n\n· 카드 → 필드로 드래그 = 소환\n· 카드 → 대상으로 드래그 = 주문 발동\n· 미니언 → 적 미니언/영웅으로 드래그 = 공격\n· 영웅 능력 (좌측) = 2마나 → 1피해\n· 도발 미니언 먼저 처리\n· 돌진 = 소환 턴에 공격\n\n적 턴은 자동'));

initGame();
</script>
</body>
